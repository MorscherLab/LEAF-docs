name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for VitePress lastUpdated git timestamps

      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Check for retired `leaf serve` references
        run: |
          # Glossary keeps `leaf serve` as a deprecated-alias entry; everywhere
          # else fails the build. `--exclude` matches basename, not path, so
          # `glossary.md` is the right pattern here.
          if grep -rEn 'leaf serve' --include='*.md' \
                 --exclude-dir=node_modules \
                 --exclude-dir=docs \
                 --exclude='glossary.md' .; then
            echo "::error::Retired command 'leaf serve' found above. Use 'leaf webui run' instead."
            exit 1
          fi

      - name: Check format, lint, and types
        run: vp check

      - name: Build VitePress site
        run: vp run build

      - name: Checkout v0.5 archive
        uses: actions/checkout@v4
        with:
          ref: archive/v0.5
          path: _archive/v0.5
          fetch-depth: 0

      - name: Build v0.5 archive into /v0.5/
        working-directory: _archive/v0.5
        run: |
          vp install --frozen-lockfile
          vp exec vitepress build --base /v0.5/
          cp -R .vitepress/dist "$GITHUB_WORKSPACE/.vitepress/dist/v0.5"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
